name: Practice Issue Check

# Сдача студенческих работ — через Issue с label `practice-N` в эталонном репозитории.
# Каждый студент работает в своём отдельном репозитории (Practic{Имя}{Фамилия}),
# поэтому этот workflow НЕ читает CI чужого репозитория (это требовало бы токенов).
# Вместо этого он валидирует, что студент приложил к Issue:
#   1) ссылку на свой репозиторий;
#   2) ссылку на конкретный Actions run (зелёный прогон CI в своём репозитории).
# Вердикт по CI преподаватель проверяет вручную по приложенной ссылке.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write

jobs:
  check:
    if: contains(toJson(github.event.issue.labels.*.name), 'practice-')
    runs-on: ubuntu-latest

    steps:
      - name: Validate submission links
        run: |
          BODY=$(gh issue view "${{ github.event.issue.number }}" --json body -q .body)

          REPO_URL=$(printf '%s' "$BODY" | grep -oiE 'https?://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' | grep -viE '/actions/runs/' | head -n1)
          RUN_URL=$(printf '%s' "$BODY" | grep -oiE 'https?://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/actions/runs/[0-9]+' | head -n1)

          MISSING=""
          if [ -z "$REPO_URL" ]; then
            MISSING="- ссылку на свой репозиторий (например, \`https://github.com/<org>/Practic<Имя><Фамилия>\`)"
          fi
          if [ -z "$RUN_URL" ]; then
            MISSING="${MISSING}
          - ссылку на Actions run (скопируйте URL зелёного прогона CI из своего репозитория)"
          fi

          if [ -n "$MISSING" ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --body "Не удалось найти обязательные ссылки в теле Issue. Добавьте:${MISSING}"
            exit 1
          fi

          echo "Submission links are present."
        env:
          GH_TOKEN: ${{ github.token }}
